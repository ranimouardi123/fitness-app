name: fitness_app
description: Application de coaching fitness - nutrition et entraînement
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.7.4
  sembast_web: ^2.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  go_router: ^14.2.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.3.4
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
